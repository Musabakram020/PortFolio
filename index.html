<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Grass Escape</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#102631; color:#fff; font-family:Arial,sans-serif; }
    body { -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
    #viewport { position:fixed; inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); display:grid; place-items:center; }
    #game { position:relative; width:min(100%, calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 9 / 16)); aspect-ratio:9 / 16; overflow:hidden; }
    canvas { display:block; width:100%; height:100%; outline:none; touch-action:none; }
    #loading { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:#102631; padding:24px; text-align:center; }
    #loading[hidden], #retry[hidden] { display:none; }
    h1 { margin:0; font-size:clamp(28px,5vw,44px); }
    p { margin:0; font-size:18px; line-height:1.5; max-width:480px; }
    progress { width:min(320px,80vw); height:16px; accent-color:#66dcc0; }
    button { border:0; border-radius:14px; padding:16px 36px; background:#66dcc0; color:#102631; font-size:18px; font-weight:bold; cursor:pointer; }
    button:hover { background:#a3efdc; } button:active { transform:scale(.96); }
  </style>
</head>
<body>
  <div id="viewport"><main id="game">
    <canvas id="unity-canvas" width="1080" height="1920" tabindex="0" aria-label="Grass Escape game"></canvas>
    <div id="loading" role="status">
      <h1>Grass Escape</h1>
      <p id="status">Getting your lawn ready...</p>
      <progress id="progress" max="1" value="0" aria-label="Loading game"></progress>
      <button id="retry" hidden>TRY AGAIN</button>
    </div>
  </main></div>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const progress = document.getElementById('progress');
    const status = document.getElementById('status');
    const retry = document.getElementById('retry');
    function failed(error) {
      console.error(error);
      loading.hidden = false;
      status.textContent = 'The game could not load. Check your connection and try again.';
      progress.hidden = true;
      retry.hidden = false;
    }
    retry.addEventListener('click', () => location.reload());
    canvas.addEventListener('pointerdown', () => canvas.focus());
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    const loader = document.createElement('script');
    loader.src = 'Build/Grass.loader.js';
    loader.onerror = () => failed('Game loader unavailable');
    loader.onload = () => {
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: 'Build/Grass.data.br',
        frameworkUrl: 'Build/Grass.framework.js.br',
        codeUrl: 'Build/Grass.wasm.br',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "FoxGames",
        productName: "ArrowOut",
        productVersion: "1.0",
        showBanner: (message, type) => { if (type === 'error') failed(message); else console.warn(message); }
      }, value => { progress.value = value; }).then(() => {
        loading.hidden = true;
        canvas.focus();
      }).catch(failed);
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>
